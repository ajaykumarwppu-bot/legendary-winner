name: Build APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make scripts executable
        run: |
          chmod +x gradlew || true
          chmod +x scripts/*.sh || true

      - name: Build standardDebug APK
        run: |
          if [ -x ./scripts/build_all_apks.sh ]; then
            ./scripts/build_all_apks.sh --debug || ./gradlew :app:assembleStandardDebug
          else
            ./gradlew :app:assembleStandardDebug
          fi

      - name: Collect APKs
        run: |
          mkdir -p output
          find app/build/outputs -name "*.apk" -exec cp -v {} output/ \; || true
          ls -la output || true

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigem-apks
          path: output/*.apk
          if-no-files-found: warn
